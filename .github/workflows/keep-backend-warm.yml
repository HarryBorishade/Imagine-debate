name: Keep backend warm

# Render's free tier spins the backend down after ~15 minutes of inactivity,
# and the next request then pays a 30-60+ second cold-start penalty (this is
# what made the "joining debate room" screen hang before timing out). Pinging
# the health endpoint more often than that keeps it from ever going to sleep.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 20 https://imagine-debate.onrender.com/health
